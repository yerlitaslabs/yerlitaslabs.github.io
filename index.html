<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minela Block Puzzle</title>
<meta name="description" content="Minela: a mosaic block puzzle. Place blocks, clear lines, chain combos and wipe the whole board.">
<style>
  :root { --bg: #0d111c; --card: #1a2033; --text: #eef1f8; --muted: #a3abc2; --accent: #ffc46b; --line: #2a3150; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
    font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; align-items: center; justify-content: center;
  }
  main { max-width: 560px; padding: 40px 16px; text-align: center; }
  .logo { display: inline-grid; grid-template-columns: repeat(3, 40px); gap: 6px; margin-bottom: 24px; }
  .logo span { height: 40px; border-radius: 9px; box-shadow: inset 0 -5px 0 rgba(0,0,0,.22); }
  h1 { font-size: 44px; letter-spacing: 10px; margin: 0; font-weight: 900; }
  .tag { color: var(--muted); font-size: 18px; margin: 4px 0 28px; }
  p { color: var(--text); }
  .play {
    display: inline-block; margin: 20px 0 32px; padding: 14px 28px; border-radius: 999px;
    background: var(--accent); color: #141414; font-weight: 800; text-decoration: none;
  }
  .links a { color: var(--accent); margin: 0 10px; font-weight: 600; }
  footer { color: var(--muted); font-size: 14px; margin-top: 28px; }
</style>
</head>
<body>
<main>
  <div class="logo" aria-hidden="true">
    <span style="background:#ff7f78"></span><span style="background:#ffc46b"></span><span style="background:#6ee7b0"></span>
    <span style="background:#6cc4ff"></span><span style="background:#6cc4ff"></span><span style="background:#a68bff"></span>
    <span style="background:#f7a8d8"></span><span style="background:#ff7f78"></span><span style="background:#ffc46b"></span>
  </div>
  <h1>MINELA</h1>
  <p class="tag">Mosaic block puzzle</p>
  <p>
    Place blocks, clear lines, chain combos and wipe the whole board. Over 1,000 Adventure levels, a new Daily
    Puzzle every day, and Classic mode for endless high scores. Plays offline.
  </p>
  <a class="play" href="https://play.google.com/store/apps/details?id=com.audio.minela">Get it on Google Play</a>
  <div class="links">
    <a href="privacy.html">Privacy Policy</a>
    <a href="privacy.html#tr">Gizlilik Politikası</a>
    <a href="mailto:erdemyerlitas@gmail.com">Contact</a>
  </div>
  <footer>© 2026 YerlitAS Labs</footer>
</main>
</body>
</html>
