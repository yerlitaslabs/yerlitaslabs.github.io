<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YerlitAS Labs</title>
<meta name="description" content="YerlitAS Labs: independent studio crafting relaxing puzzle games and practical everyday apps for Android.">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<meta property="og:title" content="YerlitAS Labs">
<meta property="og:description" content="Games & apps, crafted stone by stone.">
<meta property="og:image" content="https://yerlitaslabs.github.io/favicon.png">
<meta property="og:url" content="https://yerlitaslabs.github.io/">
<style>
  :root { --bg: #0e1320; --card: #1a2033; --text: #eef1f8; --muted: #9fb0cc; --accent: #ffb45e; --line: #2a3150; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; color: var(--text);
    background: radial-gradient(ellipse at 50% 30%, #232c55 0%, #121833 55%, #080b16 100%) fixed;
    font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; align-items: center; justify-content: center;
  }
  main { width: 100%; max-width: 620px; padding: 40px 16px; text-align: center; }
  .logo { width: 128px; height: 128px; border-radius: 28px; box-shadow: 0 12px 40px rgba(0,0,0,.45); }
  h1 { font-size: 42px; font-weight: 800; margin: 20px 0 0; letter-spacing: .5px; }
  h1 span { background: linear-gradient(90deg, #ffe29a, #ffb45e, #ff8a5b); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .labs { color: var(--muted); letter-spacing: 10px; font-weight: 700; font-size: 15px; margin: 0 0 6px 10px; }
  .tag { color: var(--muted); margin: 0 0 32px; }
  .app {
    display: flex; gap: 16px; align-items: center; text-align: left; text-decoration: none; color: var(--text);
    background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 16px 18px;
  }
  .app:hover { border-color: var(--accent); }
  .app img { width: 64px; height: 64px; border-radius: 14px; flex: none; }
  .app b { font-size: 19px; display: block; }
  .app small { color: var(--muted); font-size: 14px; }
  .app > span:nth-child(2) { min-width: 0; }
  .app .go { margin-left: auto; color: var(--accent); font-weight: 800; white-space: nowrap; }
  footer { color: var(--muted); font-size: 14px; margin-top: 32px; }
  footer a { color: var(--accent); font-weight: 600; }
</style>
</head>
<body>
<main>
  <img class="logo" src="favicon.png" alt="YerlitAS Labs logo">
  <h1>Yerlit<span>AS</span></h1>
  <p class="labs">LABS</p>
  <p class="tag">Games &amp; apps, crafted stone by stone.</p>
  <a class="app" href="minela/">
    <img src="minela/icon.png" alt="">
    <span><b>Minela: Block Puzzle</b><small>A mosaic block puzzle: 5,000 levels, a Daily Puzzle and Classic mode.</small></span>
    <span class="go">Open ›</span>
  </a>
  <footer>
    <a href="mailto:erdemyerlitas@gmail.com">Contact</a> · © 2026 YerlitAS Labs
  </footer>
</main>
</body>
</html>
